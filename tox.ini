[tox]
envlist =
    py310, py311, py312, py313, py314
    lint, doctest, docs
    cleaninstall-py310, cleaninstall-py311, cleaninstall-py312, cleaninstall-py313, cleaninstall-py314
skip_missing_interpreters = true
# Use uv for faster dependency installation.
requires = tox-uv
# Keep the tox workdir outside the repo tree to avoid file-sync locks. Every
# fallback stays absolute: an unset TEMP, which is the normal state of a POSIX
# shell, would otherwise resolve inside the checkout, where the workdir is
# neither expected nor ignored.
toxworkdir = {env:TEMP:{env:TMPDIR:/tmp}}/tox-tessera
# Force clean rebuild: tox -r (or --recreate) to delete and recreate all envs.

[testenv]
extras = dev
passenv =
    TERM
setenv =
    # Write coverage data to the env tmp dir to avoid file-sync race conditions.
    COVERAGE_FILE = {envtmpdir}/.coverage
    # Force copy mode instead of hardlinks (cross-volume compatibility).
    UV_LINK_MODE = copy
    # Do not force colored output: CLI tests assert on plain captured output.
    NO_COLOR = 1
commands =
    # --color=yes colorizes the pytest REPORT only; captured CLI output stays
    # plain thanks to NO_COLOR=1 above (Rich honors it), so output-asserting
    # tests remain deterministic.
    pytest tests/ \
        --color=yes \
        --cov=tessera \
        --cov=scripts \
        --cov-report=term-missing \
        --cov-fail-under=95 \
        --tb=short \
        -v

[testenv:lint]
# Unversioned env: pinned to the supported floor, else it follows the caller.
basepython = py310
setenv =
    # No CLI-output test runs here, so forcing tool colors is safe. Both
    # variables beat the inherited NO_COLOR=1 (verified empirically): ruff
    # honors FORCE_COLOR, mypy only honors MYPY_FORCE_COLOR.
    FORCE_COLOR = 1
    MYPY_FORCE_COLOR = 1
commands =
    # infra/ is ruff-only: jupyterhub_config.py runs under the Hub config
    # loader with injected globals, so mypy would fight the framework.
    ruff check src tests infra scripts
    ruff format --check src tests infra scripts
    mypy

[testenv:cleaninstall-{py310,py311,py312,py313,py314}]
description = Import every module of the installed package, runtime dependencies only
# Both keys below are deliberately empty, and both must stay empty.
#
# `extras =` neutralises the dev extra inherited from [testenv]. That extra is
# the whole reason no other environment here, nor any CI job, can notice a
# runtime dependency that is imported but never declared: they all install it.
#
# `deps =` changes nothing today, [testenv] declaring none. It is written so
# that adding one there later cannot quietly make this gate fat again.
extras =
deps =
# `uv pip install` is additive and never prunes. On a reused environment a
# REMOVED dependency would linger, and the gate against false greens would
# itself go green on an environment that is no longer clean. tox reuses by
# default, so this line is what keeps the local run honest; a CI runner is
# ephemeral and needs no equivalent.
recreate = true
commands = python {toxinidir}/scripts/check_clean_install.py

[testenv:doctest]
description = Verify docstring examples are executable and accurate
# Unversioned env: pinned to the supported floor, else it follows the caller.
basepython = py310
commands =
    # pytest exits 5 when no doctest is collected; tolerate that single case
    # (young modules may have no example yet) while real failures still fail.
    python -c "import sys, pytest; rc = pytest.main(['--doctest-modules', 'src/tessera', '--ignore=src/tessera/__main__.py', '--ignore=src/tessera/cli', '-v', '--tb=short', '--color=yes']); sys.exit(0 if rc == 5 else rc)"

[testenv:docs]
description = Build the Sphinx documentation and fail on any warning
# Unversioned env: pinned to the supported floor, else it follows the caller.
basepython = py310
extras = docs
changedir = docs
commands =
    # Clean previous build artifacts (cross-platform).
    python -c "import shutil; shutil.rmtree('build', ignore_errors=True)"
    # Build HTML docs with warnings treated as errors (-W). --color forces
    # colored output under tox capture (beats the inherited NO_COLOR=1).
    sphinx-build --color -W -b html source build/html
