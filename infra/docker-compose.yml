# Keycloak test bench for tessera development (tier 3 validation and E2E tests).
# Two pre-configured realms cover the refresh-token rotation typologies; realms,
# clients, users, and the intentionally aggressive token lifespans are documented
# in docs/source/development/infra/keycloak.md (the single source for this bench).
#
# Usage (from this directory): docker compose up -d

name: tessera

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tessera-keycloak
    # Stable hostname: Keycloak dev-mode H2 derives its datasource name from
    # the container hostname; random container IDs fail to resolve on some
    # Docker/WSL2 stacks and crash the boot before the realm import.
    hostname: keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8008}:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
