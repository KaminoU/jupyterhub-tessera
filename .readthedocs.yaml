# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# Optionally build the docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub

# Set the versions of Python and Node required to build the docs.
# Node is required because installing the package from source builds the
# prebuilt JupyterLab extension (npm) through the build backend hook.
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
    nodejs: "20"

python:
  install:
    # Install tessera with the documentation dependencies from pyproject.toml
    # (single source of truth for the docs requirements).
    - method: pip
      path: .
      extra_requirements:
        - docs
