name: Scorecard

on:
  # Re-score whenever the protection rules of a branch change, since several
  # checks read exactly that.
  branch_protection_rule:
  schedule:
    - cron: '27 5 * * 1'
  push:
    branches: [main]

# Least privilege by default. The job raises only what it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Upload the findings to the code scanning dashboard.
      security-events: write
      # Publish the results to the OpenSSF API, which is what makes the score
      # public and lets a badge resolve later on.
      id-token: write
      # A private repository would also need contents: read and actions: read.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
